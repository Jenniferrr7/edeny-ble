<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>叩门</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#120b0f">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #120b0f;
  --ink:       rgba(250,232,236,0.88);
  --ink-soft:  rgba(250,232,236,0.46);
  --ink-faint: rgba(250,232,236,0.24);
  --line:      rgba(250,232,236,0.10);
  --field:     rgba(255,255,255,0.045);
  --field-br:  rgba(250,232,236,0.12);
  --rose:      #cf6a8c;
  --rose-deep: #e28aa6;
  --rose-soft: rgba(207,106,140,0.30);
  --wine:      #5a1730;
  --gold:      #f2cfa5;
  --btn-ink:   #1d0f16;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Songti SC', 'Noto Serif CJK SC', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }

#bg-heat { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: background 1.8s ease; }
#fog, #petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#fog { z-index: 2; }
#petals { z-index: 4; }

.page { width: 100%; max-width: 390px; position: relative; display: flex; flex-direction: column; min-height: 100vh; }
.canvas-wrap { position: relative; z-index: 1; width: 100%; flex-shrink: 0; }
#liquid-canvas { display: block; width: 100%; height: 270px; }
.above { position: relative; z-index: 3; }

/* ── 顶栏 ── */
.topbar { position: absolute; z-index: 3; top: 12px; left: 18px; right: 18px; display: flex; align-items: center; justify-content: space-between; font-size: 10px; letter-spacing: 0.22em; color: var(--ink-faint); font-style: italic; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); margin-right: 7px; vertical-align: middle; transition: background .5s, box-shadow .5s; }
.dot.wait { background: #e0b36a; box-shadow: 0 0 8px rgba(224,179,106,.6); }
.dot.on   { background: var(--rose); box-shadow: 0 0 9px var(--rose-soft); }
.dot.off  { background: #7a4a58; }
.mail { background: none; border: none; color: var(--ink-faint); font: inherit; letter-spacing: .2em; cursor: pointer; position: relative; padding: 4px 2px; }
.mail.new { color: var(--gold); }
.mail.new::after { content: ''; position: absolute; top: 1px; right: -5px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

/* ── 温度计 ── */
.thermo-wrap { position: absolute; z-index: 3; right: 18px; top: 40px; bottom: 18px; display: flex; flex-direction: column; align-items: center; touch-action: none; }
.thermo-wrap.hidden { display: none; }
.thermo-lbl, .thermo-lbl-b { font-size: 8px; letter-spacing: .18em; color: var(--ink-faint); font-style: italic; }
.thermo-lbl { margin-bottom: 5px; } .thermo-lbl-b { margin-top: 5px; }
.thermo-track { width: 3px; flex: 1; background: var(--line); border-radius: 2px; position: relative; cursor: ns-resize; touch-action: none; }
.thermo-track::before { content: ''; position: absolute; inset: 0 -14px; }
.thermo-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: linear-gradient(to top, var(--rose-soft), var(--rose)); border-radius: 2px; }
.thermo-thumb { position: absolute; left: 50%; transform: translate(-50%, 50%); width: 11px; height: 11px; border-radius: 50%; background: var(--rose); bottom: 0%; box-shadow: 0 0 10px var(--rose-soft); }

/* ── 状态 ── */
.state-area { text-align: center; padding: 14px 28px 8px; flex-shrink: 0; }
.state-label { font-size: 46px; font-style: italic; letter-spacing: .18em; color: var(--ink); line-height: 1; transition: text-shadow 1.2s; text-indent: .18em; }
.state-msg { font-size: 13px; letter-spacing: .34em; color: var(--ink-soft); min-height: 22px; font-style: italic; margin-top: 9px; }
.cursor { display: inline-block; width: 1px; height: 11px; background: var(--ink-soft); vertical-align: middle; margin-left: 1px; animation: blink var(--blink, 1.1s) infinite; }
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
.line { height: 1px; margin: 6px 28px; background: var(--line); flex-shrink: 0; }

/* ── 玩法 ── */
.games { padding: 8px 24px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { background: transparent; color: var(--ink-soft); border: 1px solid var(--field-br); border-radius: 999px; padding: 6px 13px; font: inherit; font-size: 12px; font-style: italic; letter-spacing: .24em; text-indent: .24em; cursor: pointer; transition: all .3s; }
.chip.active { color: var(--btn-ink); background: var(--rose); border-color: var(--rose); box-shadow: 0 0 14px var(--rose-soft); }
.chip:disabled { opacity: .35; cursor: default; }
.gpanel { text-align: center; font-size: 11px; letter-spacing: .2em; color: var(--ink-soft); font-style: italic; min-height: 20px; margin-top: 10px; }
.gpanel b { font-weight: normal; color: var(--gold); letter-spacing: .1em; font-size: 15px; font-style: normal; }
.gbtns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; min-height: 0; }
.gbtns .btn { width: auto; min-width: 110px; margin: 0; padding: 12px 18px; }
.btn.hold { background: var(--wine); color: var(--ink); border: 1px solid var(--rose-soft); }
.btn.hold.down { background: var(--rose); color: var(--btn-ink); box-shadow: 0 0 22px var(--rose-soft); }
.card { margin: 10px 24px 0; padding: 14px 16px; border: 1px solid var(--rose-soft); border-radius: 12px; background: rgba(90,23,48,.28); text-align: center; font-size: 14px; letter-spacing: .12em; line-height: 1.7; display: none; }
.card.show { display: block; }
.card small { display: block; color: var(--gold); letter-spacing: .3em; margin-top: 4px; font-size: 12px; }

/* ── 控件 ── */
.controls { padding: 12px 24px 8px; flex-shrink: 0; }
.field-label { display: block; font-size: 9px; letter-spacing: .42em; color: var(--ink-faint); margin-bottom: 6px; }
.token-input, .txt { width: 100%; padding: 11px 14px; background: var(--field); border: 1px solid var(--field-br); border-radius: 10px; color: var(--ink); font-family: 'Courier New', monospace; font-size: 12px; outline: none; letter-spacing: .06em; margin-bottom: 10px; transition: border-color .3s, box-shadow .3s; }
.txt { font-family: inherit; font-size: 13px; letter-spacing: .08em; margin-bottom: 0; }
.token-input:focus, .txt:focus { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
::placeholder { color: var(--ink-faint); }
.btn { width: 100%; padding: 14px; font-family: inherit; font-size: 13px; font-style: italic; letter-spacing: .42em; cursor: pointer; border: none; border-radius: 12px; margin-bottom: 8px; text-indent: .42em; transition: opacity .15s, background .4s, box-shadow .4s; }
.btn-main { background: var(--rose); color: var(--btn-ink); box-shadow: 0 2px 14px var(--rose-soft); }
.btn-main:active { opacity: .78; }
.btn-main.dim { background: var(--rose-soft); color: var(--ink-soft); box-shadow: none; cursor: default; }
.btn-outline { background: transparent; color: var(--ink-soft); border: 1px solid var(--field-br); }
.btn-outline:active { opacity: .7; }
.btn-outline.active { color: var(--rose-deep); border-color: var(--rose-soft); }
#status { text-align: center; font-size: 10px; letter-spacing: .22em; color: var(--ink-faint); font-style: italic; min-height: 18px; margin-top: 4px; }

/* ── 留言 ── */
.notes { padding: 4px 24px 8px; }
.note-row { display: flex; gap: 8px; }
.note-row .txt { flex: 1; }
.send { flex: 0 0 auto; width: 54px; border: 1px solid var(--rose-soft); background: transparent; color: var(--rose-deep); border-radius: 10px; font: inherit; font-size: 12px; letter-spacing: .2em; text-indent: .2em; cursor: pointer; }
.send:active { background: var(--rose-soft); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.quick button { background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 11px; letter-spacing: .16em; cursor: pointer; }
.quick button:active { border-color: var(--rose); color: var(--rose-deep); }

/* ── 设置 ── */
details.set { margin: 6px 24px 0; border-top: 1px solid var(--line); padding-top: 10px; }
details.set summary { font-size: 10px; letter-spacing: .38em; color: var(--ink-faint); cursor: pointer; list-style: none; text-align: center; padding: 4px; }
details.set summary::-webkit-details-marker { display: none; }
.set-body { padding-top: 12px; }
.set-body .token-input { margin-bottom: 8px; }
.sw { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .12em; color: var(--ink-soft); margin: 8px 0; }
.sw input { accent-color: var(--rose); width: 15px; height: 15px; }
.fine { font-size: 10px; line-height: 1.7; letter-spacing: .08em; color: var(--ink-faint); margin: 6px 0 10px; }
.forget { background: none; border: 1px solid var(--line); color: var(--ink-faint); border-radius: 8px; padding: 8px; width: 100%; font: inherit; font-size: 11px; letter-spacing: .3em; cursor: pointer; }

/* ── 页脚 ── */
.foot { margin-top: auto; padding: 22px 24px 86px; text-align: center; font-size: 10px; letter-spacing: .3em; color: var(--ink-faint); font-style: italic; }
#crab { display: block; margin: 0 auto 8px; width: 34px; height: 26px; cursor: pointer; image-rendering: pixelated; opacity: .75; }

/* ── 一键停 ── */
#stop { position: fixed; z-index: 6; right: 16px; bottom: 18px; width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--rose); background: rgba(18,11,15,.82); color: var(--rose-deep); font: inherit; font-size: 16px; font-style: italic; letter-spacing: .1em; text-indent: .1em; cursor: pointer; box-shadow: 0 0 20px var(--rose-soft); backdrop-filter: blur(4px); }
#stop:active { background: var(--rose); color: var(--btn-ink); }
#heldbar { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; padding: 16px 20px 22px; background: rgba(18,11,15,.94); border-top: 1px solid var(--rose-soft); text-align: center; display: none; font-size: 12px; letter-spacing: .2em; color: var(--ink-soft); font-style: italic; }
#heldbar.show { display: block; }
#heldbar .btn { width: auto; min-width: 160px; margin: 10px 6px 0; padding: 11px 18px; }

/* ── 浮层 ── */
.sheet { position: fixed; z-index: 8; inset: 0; background: rgba(8,4,6,.78); display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(3px); }
.sheet.show { display: flex; }
.sheet-in { width: 100%; max-width: 390px; background: #1a0f14; border-top: 1px solid var(--rose-soft); border-radius: 18px 18px 0 0; padding: 22px 22px 28px; max-height: 80vh; overflow-y: auto; }
.sheet-in h3 { font-weight: normal; font-style: italic; letter-spacing: .3em; font-size: 14px; color: var(--gold); margin-bottom: 14px; text-align: center; }
.sheet-in textarea { width: 100%; min-height: 84px; resize: none; background: var(--field); border: 1px solid var(--field-br); border-radius: 10px; color: var(--ink); font: inherit; font-size: 14px; padding: 12px; outline: none; letter-spacing: .06em; line-height: 1.6; margin-bottom: 12px; }
.sheet-in textarea:focus { border-color: var(--rose); }
.sheet-in .btn { margin-bottom: 8px; }
.reply { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.8; letter-spacing: .08em; white-space: pre-wrap; }
.reply small { display: block; color: var(--ink-faint); font-size: 10px; letter-spacing: .2em; margin-bottom: 4px; font-style: italic; }

/* ── 叩门的光 ── */
#crack { position: fixed; z-index: 9; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; pointer-events: none; opacity: 0; background: linear-gradient(to bottom, transparent, rgba(255,226,214,.95) 18%, rgba(255,226,214,.95) 82%, transparent); box-shadow: 0 0 40px 14px rgba(255,150,170,.55); }
#crack.go { animation: crack 1.9s ease-out; }
@keyframes crack {
  0%   { opacity: 0; transform: scaleX(1); }
  12%  { opacity: 1; }
  55%  { opacity: .9; transform: scaleX(70); }
  100% { opacity: 0; transform: scaleX(150); }
}
#toast { position: fixed; z-index: 10; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(40,18,28,.92); border: 1px solid var(--rose-soft); color: var(--ink); padding: 8px 18px; border-radius: 999px; font-size: 12px; letter-spacing: .2em; font-style: italic; opacity: 0; transition: opacity .4s; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="bg-heat"></div>
<canvas id="fog"></canvas>
<canvas id="petals"></canvas>
<div id="crack"></div>

<div class="page">
  <div class="canvas-wrap">
    <canvas id="liquid-canvas"></canvas>
    <div class="topbar">
      <span><span class="dot" id="dot"></span><span id="dotlbl">未连接</span></span>
      <button class="mail" id="mail">信</button>
    </div>
    <div class="thermo-wrap hidden" id="thermo-wrap">
      <div class="thermo-lbl">深</div>
      <div class="thermo-track" id="thermo-track">
        <div class="thermo-fill" id="thermo-fill"></div>
        <div class="thermo-thumb" id="thermo-thumb"></div>
      </div>
      <div class="thermo-lbl-b">浅</div>
    </div>
  </div>

  <div class="state-area above">
    <div class="state-label" id="state-label">静</div>
    <div class="state-msg" id="state-msg"><span class="cursor"></span></div>
  </div>

  <div class="line above"></div>

  <div class="games above">
    <div class="chips" id="chips">
      <button class="chip" data-g="edge">边缘</button>
      <button class="chip" data-g="stair">阶梯</button>
      <button class="chip" data-g="permit">许可</button>
      <button class="chip" data-g="dice">骰子</button>
      <button class="chip" data-g="card">抽卡</button>
    </div>
    <div class="gpanel" id="gpanel"></div>
    <div class="gbtns" id="gbtns">
      <button class="btn hold hidden" id="hold">忍</button>
      <button class="btn btn-outline hidden" id="beg">求</button>
    </div>
  </div>
  <div class="card above" id="card"></div>

  <div class="controls above">
    <label class="field-label">通行令牌</label>
    <input type="password" id="tok" class="token-input" placeholder="粘贴于此……" autocomplete="off">
    <button id="btn" class="btn btn-main">叩　门</button>
    <button id="tog" class="btn btn-outline">自　主</button>
    <div id="status">先填令牌，再叩门</div>
  </div>

  <div class="notes above">
    <label class="field-label">留一句</label>
    <div class="note-row">
      <input type="text" id="note" class="txt" placeholder="写给他……" maxlength="300" autocomplete="off">
      <button class="send" id="send">递</button>
    </div>
    <div class="quick" id="quick"></div>
  </div>

  <details class="set above">
    <summary>· 设　置 ·</summary>
    <div class="set-body">
      <label class="sw"><input type="checkbox" id="rem"> 记住令牌（只存在这台手机）</label>
      <label class="field-label">日志仓库</label>
      <input type="text" id="repo" class="token-input" placeholder="账号/私有仓库名" autocomplete="off" autocapitalize="off">
      <label class="field-label">日志令牌</label>
      <input type="password" id="tokb" class="token-input" placeholder="只给私有仓库的那一把" autocomplete="off">
      <label class="sw"><input type="checkbox" id="logon"> 记录这一场（按键与留言）</label>
      <label class="sw"><input type="checkbox" id="vibon"> 手机跟着震</label>
      <label class="sw"><input type="checkbox" id="sndon"> 心跳声</label>
      <div class="fine">日志与留言只写进你的私有仓库，不会出现在这个公开页面里。不填日志令牌，就不记录，其余照常。</div>
      <button class="forget" id="forget">忘　掉　全　部</button>
    </div>
  </details>

  <div class="foot above">
    <svg id="crab" viewBox="0 0 17 13" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><g fill="#e8742a"><rect x="4" y="4" width="9" height="5"/><rect x="2" y="2" width="2" height="2"/><rect x="1" y="0" width="2" height="3"/><rect x="13" y="2" width="2" height="2"/><rect x="14" y="0" width="2" height="3"/><rect x="3" y="3" width="1" height="2"/><rect x="13" y="3" width="1" height="2"/><rect x="3" y="9" width="1" height="2"/><rect x="5" y="9" width="1" height="3"/><rect x="11" y="9" width="1" height="3"/><rect x="13" y="9" width="1" height="2"/></g><g fill="#120b0f"><rect x="6" y="5" width="1" height="2"/><rect x="10" y="5" width="1" height="2"/></g></svg>
    <span id="days"></span>
  </div>
</div>

<button id="stop">停</button>
<div id="heldbar">已经停了。<br><button class="btn btn-outline" id="resume">恢　复</button><button class="btn btn-outline" id="leave">留　一　句</button></div>
<div id="toast"></div>

<div class="sheet" id="after"><div class="sheet-in">
  <h3>想留点什么吗</h3>
  <textarea id="after-txt" placeholder="刚才……"></textarea>
  <button class="btn btn-main" id="after-ok">递　出　去</button>
  <button class="btn btn-outline" id="after-no">不了</button>
</div></div>

<div class="sheet" id="inbox"><div class="sheet-in">
  <h3>他回你的</h3>
  <div id="inbox-list"></div>
  <button class="btn btn-outline" id="inbox-close" style="margin-top:14px">合　上</button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  del(k)    { try { localStorage.removeItem(k); } catch (_) {} },
};
const rnd = (a, b) => a + Math.random() * (b - a);
const pad2 = n => String(n).padStart(2, '0');
const mmss = s => pad2(Math.floor(s / 60)) + ':' + pad2(Math.floor(s % 60));

// ── PALETTE ──────────────────────────────────────────────
const POOL_IN  = [[62,22,38],  [214,96,132]];
const POOL_OUT = [[30,12,20],  [140,42,80]];
const ACCENT   = [[150,72,100],[244,156,176]];
const HALO     = [226,96,136];
const SHEEN    = [255,228,216];
function mix(pair, t) {
  const [a, b] = pair;
  return [0,1,2].map(i => Math.round(a[i] + (b[i]-a[i]) * t));
}

// ── POOL CANVAS ──────────────────────────────────────────
const canvas = $('liquid-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, CX = 0, CY = 0, poolR = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  W = w; H = h;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = w / 2; CY = h / 2 + 8;
  poolR = Math.min(w, h) * 0.34;
  resizeFx();
}
window.addEventListener('resize', resize);

const ripples = [], drops = [];
let rippleTimer = 0;
class Ripple {
  constructor(x, y, speed, maxR) { this.x = x; this.y = y; this.r = 0; this.maxR = maxR; this.speed = speed; this.dead = false; }
  tick() { this.r += this.speed; if (this.r >= this.maxR) this.dead = true; }
  draw(t) {
    const a = Math.max(0, (1 - this.r / this.maxR) * 0.62);
    const [rr,gg,bb] = mix(ACCENT, t);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${rr},${gg},${bb},${a})`; ctx.lineWidth = 1.1 + t * 0.7; ctx.stroke();
  }
}
class Drop {
  constructor(x, y, t) {
    const ang = Math.random() * Math.PI * 2, spd = 1.5 + Math.random() * 3 * t;
    this.x = x; this.y = y; this.vx = Math.cos(ang) * spd; this.vy = Math.sin(ang) * spd - 2 - Math.random() * 2.5;
    this.r = 1.5 + Math.random() * 2.5; this.a = 0.85; this.dead = false;
  }
  tick() { this.vy += 0.2; this.x += this.vx; this.y += this.vy; this.a -= 0.024; if (this.a <= 0) this.dead = true; }
  draw(t) {
    const [rr,gg,bb] = mix(ACCENT, t);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rr},${gg},${bb},${this.a})`; ctx.fill();
  }
}

// ── 雾玻璃 + 花瓣 ────────────────────────────────────────
const fog = $('fog'), fctx = fog.getContext('2d');
const mask = document.createElement('canvas'), mctx = mask.getContext('2d');
const pet = $('petals'), pctx = pet.getContext('2d');
let FW = 0, FH = 0, FS = 0.5, fogFrame = 0;
function resizeFx() {
  FW = window.innerWidth; FH = window.innerHeight;
  fog.width = mask.width = Math.round(FW * FS);
  fog.height = mask.height = Math.round(FH * FS);
  pet.width = FW; pet.height = FH;
}
function wipe(x, y, r) {
  const mx = x * FS, my = y * FS, mr = r * FS;
  const g = mctx.createRadialGradient(mx, my, 0, mx, my, mr);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.6, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  mctx.globalCompositeOperation = 'source-over';

}
let lastWX = null, lastWY = null;
function wipeMove(x, y) {
  if (lastWX !== null) {
    const dx = x - lastWX, dy = y - lastWY, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 10));
    for (let i = 1; i <= n; i++) wipe(lastWX + dx * i / n, lastWY + dy * i / n, 30);

const glass = [];       // 玻璃上滑落的水珠
const petals = [];
function fogStep(t) {
  fogFrame++;
  // 蒙的雾：强度越高越浓
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, fog.width, fog.height);
  const g = fctx.createLinearGradient(0, 0, 0, fog.height);
  g.addColorStop(0, 'rgba(214,160,180,1)'); g.addColorStop(1, 'rgba(170,110,134,1)');
  fctx.globalAlpha = 0.10 + t * 0.17;
  fctx.fillStyle = g; fctx.fillRect(0, 0, fog.width, fog.height);
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'destination-out';
  fctx.drawImage(mask, 0, 0);
  // 手指抹开的痕，慢慢糊回去
  mctx.globalCompositeOperation = 'destination-out';
  mctx.fillStyle = 'rgba(0,0,0,0.014)'; mctx.fillRect(0, 0, mask.width, mask.height);
  if (fogFrame % 24 === 0) { mctx.fillStyle = 'rgba(0,0,0,0.07)'; mctx.fillRect(0, 0, mask.width, mask.height); }

  if (Math.random() < 0.010 + t * 0.030) glass.push({ x: rnd(10, FW - 10), y: rnd(0, FH * 0.55), v: rnd(0.4, 1.2) + t, life: rnd(60, 220) });
  for (let i = glass.length - 1; i >= 0; i--) {
    const d = glass[i]; d.y += d.v; d.life--;
    wipe(d.x, d.y, 2.6);
    if (d.life <= 0 || d.y > FH) glass.splice(i, 1);
  }
  // 花瓣：只在最高档
  pctx.clearRect(0, 0, FW, FH);
  if (t > 0.82 && Math.random() < 0.05 + (t - 0.82) * 0.9) petals.push({ x: rnd(0, FW), y: -12, vy: rnd(0.7, 1.5), vx: rnd(-0.4, 0.4), rot: rnd(0, 6.28), vr: rnd(-0.03, 0.03), s: rnd(4, 7), ph: rnd(0, 6.28) });
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.y += p.vy; p.ph += 0.03; p.x += p.vx + Math.sin(p.ph) * 0.5; p.rot += p.vr;
    pctx.save(); pctx.translate(p.x, p.y); pctx.rotate(p.rot);
    pctx.fillStyle = `rgba(226,120,152,${p.y > FH - 60 ? Math.max(0, (FH - p.y) / 60) * 0.85 : 0.85})`;
    pctx.beginPath(); pctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2); pctx.fill();
    pctx.restore();

}

// ── ANIMATION ────────────────────────────────────────────
let breath = 0, intensitySmooth = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!W) return;
  intensitySmooth += (cur / 255 - intensitySmooth) * 0.055;
  const t = intensitySmooth;
  breath += 0.022 + t * 0.02;
  ctx.clearRect(0, 0, W, H);

  if (t > 0.02) {
    const gr = Math.min(poolR * (1.4 + t * 2.2), H - CY - 2);
    const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, gr);
    grd.addColorStop(0,    `rgba(${HALO[0]},${HALO[1]},${HALO[2]},${t * 0.26})`);
    grd.addColorStop(0.55, `rgba(${HALO[0]},${HALO[1]},${HALO[2]},${t * 0.10})`);
    grd.addColorStop(1,    `rgba(${HALO[0]},${HALO[1]},${HALO[2]},0)`);
    ctx.beginPath(); ctx.arc(CX, CY, gr, 0, Math.PI * 2); ctx.fillStyle = grd; ctx.fill();
  }
  const breathe = 1 + 0.022 * Math.sin(breath) * (1 - t * 0.55);
  const r = poolR * breathe;
  const cIn = mix(POOL_IN, t), cOut = mix(POOL_OUT, t);
  const pg = ctx.createRadialGradient(CX - r * 0.14, CY - r * 0.18, r * 0.04, CX, CY, r);
  pg.addColorStop(0, `rgb(${cIn[0]},${cIn[1]},${cIn[2]})`);
  pg.addColorStop(1, `rgb(${cOut[0]},${cOut[1]},${cOut[2]})`);
  ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fillStyle = pg; ctx.fill();

  const rimA = 0.2 + t * 0.5, cRim = mix(ACCENT, t);
  ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${cRim[0]},${cRim[1]},${cRim[2]},${rimA})`; ctx.lineWidth = 1.4 + t * 2.2; ctx.stroke();

  for (let i = 0; i < 3; i++) {
    const ang = breath * (0.65 + i * 0.28) + i * 2.09;
    const sx = CX + Math.cos(ang) * r * (0.22 + i * 0.11), sy = CY + Math.sin(ang * 1.28) * r * (0.14 + i * 0.07);
    ctx.beginPath(); ctx.arc(sx, sy, (3 + i * 2) * breathe, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${SHEEN[0]},${SHEEN[1]},${SHEEN[2]},${0.30 + i * 0.09})`; ctx.fill();
  }

  rippleTimer++;
  const freq = Math.max(3, 58 - t * 50);
  if (rippleTimer % Math.round(freq) === 0) {
    const ang = Math.random() * Math.PI * 2, dist = Math.random() * r * 0.48;
    ripples.push(new Ripple(CX + Math.cos(ang)*dist, CY + Math.sin(ang)*dist, 0.75 + t*2.1, (18+t*58)+Math.random()*18));
    if (t > 0.68 && Math.random() < (t - 0.68) * 2.8) {
      const ea = Math.random() * Math.PI * 2;
      drops.push(new Drop(CX + Math.cos(ea)*r*(0.7+Math.random()*0.35), CY + Math.sin(ea)*r*(0.7+Math.random()*0.35), t));
    }
  }
  for (let i = ripples.length-1; i >= 0; i--) { ripples[i].tick(); ripples[i].draw(t); if (ripples[i].dead) ripples.splice(i,1); }
  for (let i = drops.length-1;  i >= 0; i--) { drops[i].tick();  drops[i].draw(t);  if (drops[i].dead)  drops.splice(i,1); }

  if (t > 0.82) {
    const ov = (t - 0.82) / 0.18, cOv = mix(ACCENT, 1);
    ctx.beginPath(); ctx.arc(CX, CY, r * (1 + ov * 0.09), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${cOv[0]},${cOv[1]},${cOv[2]},${ov * 0.42})`; ctx.lineWidth = 3 + ov * 5; ctx.stroke();
  }
  fogStep(t);
  // 高档的颤：整个池子轻轻抖
  canvas.style.transform = t > 0.6 ? `translate(${(Math.random()-.5)*(t-.6)*5}px,${(Math.random()-.5)*(t-.6)*5}px)` : '';
}

function setBgHeat(t) {

}

const STATES = [

  { at:  70, label: '渐燃', msgs: ['热了', '腿夹紧了', '下面开始湿了', '继续吗？我说继续', '别低头，看着我'] },
  { at: 115, label: '难禁', msgs: ['湿透了，自己听', '里面在缩', '手别乱动', '不许躲', '咬着牙'] },

function getState(v) { let s = STATES[0]; for (const st of STATES) if (v >= st.at) s = st; return s; }

let ch, dev, keepT, pollT, manual = false, cur = 0, last = -1, base = 0, held = false, remote = {}, lastSay = '';

async function send(v) {

// ── 玩法 ─────────────────────────────────────────────────
let game = null, holding = false, endure = 0, card = null;
const STAIR = STATES.map(s => s.at);

function mkEdge(p) {
  return { name: 'edge', lv: 0, phase: 'up', t: 0, cool: 0, peak: p.peak || 205, speed: p.speed || 8,
    tick(dt) {
      this.cool = Math.max(0, this.cool - dt);
      if (this.phase === 'up') {
        this.lv = Math.min(255, this.lv + this.speed * dt);
        if (this.lv >= this.peak) { this.phase = 'down'; this.t = 0; this.lv = 70; say('先别。放。'); evt('edge-drop'); }
        else if (this.lv >= 115) {
          if (holding) endure += dt;
          else if (this.cool <= 0) { this.lv = Math.min(255, nextAt(this.lv)); this.cool = 3; say('松手了。罚。'); evt('edge-slip'); }
        }
      } else { this.t += dt; if (this.t >= 7) { this.phase = 'up'; this.lv = 70; } }
    },
    level() { return this.lv; },
    panel() { return `忍了 <b>${mmss(endure)}</b> · 到「难禁」以上要一直按住`; },
  };
}
function mkStair() {
  return { name: 'stair', idx: 0, t: 0, beg: 3,
    tick(dt) { this.t += dt; if (this.t >= 25 && this.idx < 5) { this.idx++; this.t = 0; say(STATES[this.idx].msgs[0]); } },
    level() { return this.idx ? STAIR[this.idx] + 10 : 0; },
    panel() { return `每 25 秒上一档 · 还能求 <b>${this.beg}</b> 次`; },
  };
}
function mkPermit(p, by) {
  return { name: 'permit', by, permitted: false, at: 0, warn: 0,
    tick(dt) {
      const capped = base > 154;
      if (this.by === 'remote') this.permitted = remote.permit === true && base >= 115;
      else if (!this.permitted) {
        if (capped) { if (!this.at) this.at = Date.now() + rnd(45, 120) * 1000; if (Date.now() >= this.at) { this.permitted = true; say('准了。'); evt('permit'); } }
      }
      if (base < 115) { this.permitted = false; this.at = 0; }
      this.warn = Math.max(0, this.warn - dt);
      if (capped && !this.permitted && this.warn <= 0) { this.warn = 10; say('不许。'); }
    },
    level(b) { return this.permitted ? b : Math.min(b, 154); },
    panel() { return this.permitted ? '<b>准了</b>' : (base > 154 ? '<b>不许</b>' : '到「失控」要等我准'); },
  };
}
function mkDice() {
  const lv = Math.round(rnd(60, 230)), dur = Math.round(rnd(20, 60));

    tick(dt) { this.t += dt; if (this.t >= this.dur) { stopGame(); say('完了。喘口气。'); } },
    level() { return this.lv; },
    panel() { return `定了，不能取消 · 还剩 <b>${Math.max(0, Math.ceil(this.dur - this.t))}</b> 秒`; },
  };
}

function startGame(name, by = 'self', p = {}) {
  if (held) return;
  if (game && game.locked) return;
  if (game) stopGame(true);
  endure = 0;
  game = name === 'edge' ? mkEdge(p) : name === 'stair' ? mkStair() : name === 'permit' ? mkPermit(p, by) : name === 'dice' ? mkDice() : null;

}

  game = null; holding = false; renderGames(); compute();
}

// ── 远程 ─────────────────────────────────────────────────
async function poll() {
  if (manual || held) return;
  const k = getK(); if (!k) return;
  try {
    const r = await fetch('https://api.github.com/repos/Jenniferrr7/edeny-ble/contents/cmd.json',
      { headers: { 'Authorization':'token '+k, 'Accept':'application/vnd.github.v3.raw' }, cache:'no-store' });
    if (!r.ok) { L('错误 '+r.status); return; }
    const d = await r.json();
    let c = d;
    if (typeof d.level !== 'number' && typeof d.content === 'string') {
      try { c = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\s/g,''))))); } catch(_) { c = {}; }
    }
    lastOk = Date.now();
    applyRemote(c);
  } catch(e) { L('err: '+e.message); }
}
function applyRemote(c) {
  remote = c || {};

  const exp = remote.until ? Date.parse(remote.until) : 0;
  const expired = !!exp && Date.now() > exp;
  const v = !expired && typeof remote.level === 'number' ? remote.level : 0;
  const want = !expired && typeof remote.game === 'string' && remote.game ? remote.game : null;
  if (expired && last !== 0) { evt('expired'); say('时间到。', 8000); }
  if (want && !(game && game.by === 'remote' && game.name === want)) startGame(want, 'remote', remote.params || {});
  else if (!want && game && game.by === 'remote') stopGame();
  if (typeof remote.say === 'string' && remote.say && remote.say !== lastSay) { lastSay = remote.say; say(remote.say, 30000); evt('say', { text: remote.say }); }
  if (v !== last) { last = v; L(v > 0 ? '♡ 远程  ' + v : '♡ 归于宁静'); }
  base = v; compute();
}

$('tog').onclick = () => {
  manual = !manual;
  const b = $('tog');
  b.classList.toggle('active', manual);
  b.textContent = manual ? '切回远程' : '自　主';
  $('thermo-wrap').classList.toggle('hidden', !manual);
  base = 0; last = -1;
  if (game && game.by === 'remote') stopGame();
  compute();
  L(manual ? '自主模式' : '远程模式');
};

// ── 蓝牙（连接那段原样保留，只在后面挂了状态灯与断线重连）──
function setDot(kind, text) { $('dot').className = 'dot ' + kind; $('dotlbl').textContent = text; }
let wl = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch(_) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ch) keepAwake(); });

$('btn').onclick = async () => {
  if (!getK()) { L('先填令牌……'); return; }
  try {
    setDot('wait', '连接中');
    const d = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:['0000ffe0-0000-1000-8000-00805f9b34fb'] });
    dev = d;
    const s  = await d.gatt.connect();
    const sv = await s.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
    ch = await sv.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
    cur = 0; last = 0; send(0);
    L('♡ 已入，等待……');
    setDot('on', '已入');
    const b = $('btn');
    b.textContent = '已　入'; b.classList.add('dim');
    $('crack').classList.remove('go'); void $('crack').offsetWidth; $('crack').classList.add('go');
    keepAwake(); sessionStart();
    d.addEventListener('gattserverdisconnected', reconnect);
    clearInterval(keepT);
    keepT = setInterval(() => send(cur), 1400);
    setTimeout(() => { last=-1; poll(); pollT=setInterval(poll,1500); }, 3000);
  } catch(e) { L('错误: '+e.message); setDot('off', '没连上'); }
};
async function reconnect() {
  ch = null; setDot('wait', '重连中'); evt('ble-drop');
  for (let i = 0; i < 4; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const s = await dev.gatt.connect();
      const sv = await s.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
      ch = await sv.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
      send(cur); setDot('on', '已入'); evt('ble-back'); return;
    } catch(_) {}
  }
  setDot('off', '断了'); L('蓝牙断了，点「叩门」重连'); $('btn').textContent = '叩　门'; $('btn').classList.remove('dim');
}

// ── 手机震 / 心跳声 ──────────────────────────────────────
setInterval(() => {
  if ($('vibon').checked && cur > 0 && navigator.vibrate) navigator.vibrate(Math.round(40 + cur / 255 * 260));
}, 500);
let actx = null, beatT = null;
function beat() {
  clearTimeout(beatT);
  if (!$('sndon').checked || !actx) return;
  const t = intensitySmooth, now = actx.currentTime, vol = 0.06 + t * 0.22;
  [[0, 62], [0.17, 50]].forEach(([off, f]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, now + off); o.frequency.exponentialRampToValueAtTime(f * 0.6, now + off + 0.12);
    g.gain.setValueAtTime(0.0001, now + off); g.gain.exponentialRampToValueAtTime(vol, now + off + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.16);
    o.connect(g); g.connect(actx.destination); o.start(now + off); o.stop(now + off + 0.2);
  });
  beatT = setTimeout(beat, 60000 / (58 + t * 112));
}
$('sndon').onchange = () => {
  if ($('sndon').checked) { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); beat(); } catch(_) {} }
  saveSettings();
};

// ── 日志（只写进你自己的私有仓库）────────────────────────
let sess = null, dirty = false, flushT = null, flushing = false;
function logCfg() {
  const repo = $('repo').value.trim(), tk = $('tokb').value.trim();
  return $('logon').checked && /^[\w.-]+\/[\w.-]+$/.test(repo) && tk ? { repo, tk } : null;
}
function sessionStart() {
  if (sess) return;
  const d = new Date();
  sess = { id: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`, started: d.toISOString(), events: [], sha: null };
  evt('open');
}
function evt(type, data) {
  if (!sess) { if (!['note', 'after'].includes(type) && !ch) return; sessionStart(); if (!sess) return; }
  sess.events.push(Object.assign({ t: new Date().toISOString(), type, lv: cur }, data || {}));
  dirty = true;
  store.set('edeny.sess', JSON.stringify(sess));
  clearTimeout(flushT); flushT = setTimeout(flush, 20000);
}
async function flush(keep) {
  if (!sess || !dirty || flushing) return;
  const c = logCfg(); if (!c) return;
  flushing = true;
  const body = { session: sess.id, started: sess.started, events: sess.events };
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(body, null, 1))));
  const url = `https://api.github.com/repos/${c.repo}/contents/sessions/${sess.id}.json`;
  const hd = { 'Authorization': 'token ' + c.tk, 'Accept': 'application/vnd.github+json' };
  try {
    let r = await fetch(url, { method: 'PUT', headers: hd, keepalive: !!keep, body: JSON.stringify({ message: 'session ' + sess.id, content, sha: sess.sha || undefined }) });
    if (r.status === 409 || r.status === 422) {
      const g = await fetch(url, { headers: hd, cache: 'no-store' });
      if (g.ok) { sess.sha = (await g.json()).sha; r = await fetch(url, { method: 'PUT', headers: hd, body: JSON.stringify({ message: 'session ' + sess.id, content, sha: sess.sha }) }); }
    }
    if (r.ok) { sess.sha = (await r.json()).content.sha; dirty = false; store.set('edeny.sess', JSON.stringify(sess)); }
    else if (r.status === 401) L('日志令牌过期了，换一把');
    else if (r.status === 404) L('找不到日志仓库，检查名字和权限');
  } catch(_) {}
  flushing = false;
}
window.addEventListener('pagehide', () => flush(true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(true); });

// ── 留言 ─────────────────────────────────────────────────
const toastEl = $('toast'); let toastT = null;
function toast(t) { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2200); }
const PHRASES = ['好', '再来', '受不了', '停一下'];
PHRASES.forEach(p => { const b = document.createElement('button'); b.textContent = p; b.onclick = () => leaveNote(p); $('quick').appendChild(b); });
function leaveNote(text, kind = 'note') {
  text = (text || '').trim(); if (!text) return false;
  evt(kind, { text });
  toast(logCfg() ? '递出去了' : '记下了（还没填日志令牌，只在这台手机里）');
  flush();
  return true;
}
$('send').onclick = () => { if (leaveNote($('note').value)) $('note').value = ''; };
$('note').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
function openAfter() { $('after').classList.add('show'); $('after-txt').focus(); }
$('after-ok').onclick = () => { if (leaveNote($('after-txt').value, 'after')) { $('after-txt').value = ''; $('after').classList.remove('show'); } };
$('after-no').onclick = () => $('after').classList.remove('show');

// ── 回信 ─────────────────────────────────────────────────
let replies = [];
async function checkReplies() {
  const c = logCfg(); if (!c) return;
  try {
    const r = await fetch(`https://api.github.com/repos/${c.repo}/contents/reply.json`, { headers: { 'Authorization': 'token ' + c.tk, 'Accept': 'application/vnd.github.v3.raw' }, cache: 'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    replies = Array.isArray(j) ? j : [];
    const lastId = replies.length ? String(replies[replies.length - 1].id) : '';
    $('mail').classList.toggle('new', !!lastId && lastId !== store.get('edeny.seen', ''));
  } catch(_) {}
}
$('mail').onclick = () => {
  const list = $('inbox-list'); list.innerHTML = '';
  if (!replies.length) { const d = document.createElement('div'); d.className = 'reply'; d.textContent = '还没有。他看到了，会写的。'; list.appendChild(d); }
  replies.slice().reverse().forEach(x => {
    const d = document.createElement('div'); d.className = 'reply';
    const s = document.createElement('small'); s.textContent = x.at || ''; d.appendChild(s);
    d.appendChild(document.createTextNode(x.text || ''));
    list.appendChild(d);
  });
  if (replies.length) store.set('edeny.seen', String(replies[replies.length - 1].id));
  $('mail').classList.remove('new');
  $('inbox').classList.add('show');
};
$('inbox-close').onclick = () => $('inbox').classList.remove('show');
setInterval(checkReplies, 90000);

// ── 设置 / 记住 ──────────────────────────────────────────
function saveSettings() {
  store.set('edeny.rem', $('rem').checked ? '1' : '0');
  store.set('edeny.logon', $('logon').checked ? '1' : '0');
  store.set('edeny.vib', $('vibon').checked ? '1' : '0');
  store.set('edeny.snd', $('sndon').checked ? '1' : '0');
  if ($('rem').checked) { store.set('edeny.tokA', $('tok').value); store.set('edeny.repo', $('repo').value); store.set('edeny.tokB', $('tokb').value); }
  else { store.del('edeny.tokA'); store.del('edeny.repo'); store.del('edeny.tokB'); }
}
['rem', 'logon', 'vibon'].forEach(id => $(id).onchange = saveSettings);
['tok', 'repo', 'tokb'].forEach(id => $(id).addEventListener('change', saveSettings));
$('forget').onclick = () => {
  ['edeny.rem','edeny.logon','edeny.vib','edeny.snd','edeny.tokA','edeny.repo','edeny.tokB','edeny.seen','edeny.sess'].forEach(store.del);
  $('rem').checked = $('logon').checked = $('vibon').checked = $('sndon').checked = false;
  $('tok').value = $('repo').value = $('tokb').value = '';
  toast('都忘掉了');
};
(function loadSettings() {
  $('rem').checked = store.get('edeny.rem', '0') === '1';
  $('logon').checked = store.get('edeny.logon', '0') === '1';
  $('vibon').checked = store.get('edeny.vib', '0') === '1';
  $('sndon').checked = store.get('edeny.snd', '0') === '1' && false; // 声音必须由点击开启
  if ($('rem').checked) { $('tok').value = store.get('edeny.tokA', ''); $('repo').value = store.get('edeny.repo', ''); $('tokb').value = store.get('edeny.tokB', ''); if ($('tok').value) L('令牌记着，直接叩门'); }
  // 上一场没来得及发完的，接着发
  try { const s = JSON.parse(store.get('edeny.sess', 'null')); if (s && s.events && s.events.length) { sess = s; dirty = true; setTimeout(flush, 4000); } } catch(_) {}
  setTimeout(checkReplies, 2500);
})();

// ── 页脚 ─────────────────────────────────────────────────
(function () {
  const n = Math.floor((Date.now() - new Date(2026, 5, 25).getTime()) / 86400000) + 1;
  $('days').textContent = `第 ${n} 天`;
  const msgs = ['钳子不碰。', '戳两下才会裂开。', '爸爸在。', '别戳了，痒。'];
  let k = 0; $('crab').onclick = () => toast(msgs[k++ % msgs.length]);
})();

resize();
requestAnimationFrame(resize);
frame();
updateDisplay(0);
</script>
