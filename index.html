<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>叩门</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #05050a;
  color: rgba(255,255,255,0.82);
  font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#bg-heat {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  transition: background 1.8s ease;
}

.page {
  width: 100%;
  max-width: 390px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── CANVAS ── */
.canvas-wrap {
  position: relative;
  width: 100%;
  flex-shrink: 0;
}
#liquid-canvas {
  display: block;
  width: 100%;
  height: 300px;
}

/* ── THERMO (manual) ── */
.thermo-wrap {
  position: absolute;
  right: 18px;
  top: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  touch-action: none;
}
.thermo-wrap.hidden { display: none; }
.thermo-lbl {
  font-size: 8px;
  letter-spacing: 0.18em;
  color: rgba(255,255,255,0.18);
  font-style: italic;
  margin-bottom: 5px;
}
.thermo-lbl-b {
  font-size: 8px;
  letter-spacing: 0.18em;
  color: rgba(255,255,255,0.18);
  font-style: italic;
  margin-top: 5px;
}
.thermo-track {
  width: 3px;
  flex: 1;
  background: rgba(255,255,255,0.07);
  border-radius: 2px;
  position: relative;
  cursor: ns-resize;
  touch-action: none;
}
.thermo-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 0%;
  background: linear-gradient(to top, rgba(120,8,22,0.9), rgba(220,55,75,1));
  border-radius: 2px;
}
.thermo-thumb {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 50%);
  width: 11px; height: 11px;
  border-radius: 50%;
  background: rgba(220,55,75,1);
  bottom: 0%;
  box-shadow: 0 0 8px rgba(220,55,75,0.7);
}

/* ── STATE ── */
.state-area {
  text-align: center;
  padding: 18px 28px 12px;
  flex-shrink: 0;
}
.state-label {
  font-size: 48px;
  font-weight: normal;
  font-style: italic;
  letter-spacing: 0.18em;
  color: rgba(255,255,255,0.88);
  line-height: 1;
  transition: text-shadow 1.2s;
  text-indent: 0.18em;
}
.state-msg {
  font-size: 12px;
  letter-spacing: 0.38em;
  color: rgba(255,255,255,0.25);
  min-height: 20px;
  font-style: italic;
  margin-top: 9px;
}
.cursor {
  display: inline-block;
  width: 1px; height: 10px;
  background: rgba(255,255,255,0.3);
  vertical-align: middle;
  margin-left: 1px;
  animation: blink 1.1s infinite;
}
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ── DIVIDER ── */
.line {
  height: 1px;
  margin: 6px 28px;
  background: rgba(255,255,255,0.055);
  flex-shrink: 0;
}

/* ── CONTROLS ── */
.controls {
  padding: 12px 24px 36px;
  flex-shrink: 0;
}
.field-label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.42em;
  color: rgba(255,255,255,0.18);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.token-input {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255,255,255,0.038);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 1px;
  color: rgba(255,255,255,0.72);
  font-family: 'Courier New', monospace;
  font-size: 12px;
  outline: none;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  transition: border-color 0.3s;
}
.token-input:focus { border-color: rgba(200,40,60,0.45); }
.token-input::placeholder { color: rgba(255,255,255,0.16); }
.btn {
  width: 100%;
  padding: 14px;
  font-family: 'Palatino Linotype', Palatino, Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.42em;
  cursor: pointer;
  border: none;
  border-radius: 1px;
  margin-bottom: 8px;
  text-indent: 0.42em;
  transition: opacity 0.15s, background 0.4s;
}
.btn-main {
  background: rgba(175,18,38,0.88);
  color: rgba(255,255,255,0.9);
}
.btn-main:active { opacity: 0.75; }
.btn-main.dim {
  background: rgba(70,6,14,0.5);
  color: rgba(255,255,255,0.22);
  cursor: default;
}
.btn-outline {
  background: transparent;
  color: rgba(255,255,255,0.28);
  border: 1px solid rgba(255,255,255,0.09);
}
.btn-outline:active { opacity: 0.7; }
.btn-outline.active {
  color: rgba(200,50,68,0.8);
  border-color: rgba(200,50,68,0.28);
}
#status {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.22em;
  color: rgba(255,255,255,0.18);
  font-style: italic;
  min-height: 18px;
  margin-top: 4px;
}
</style>
</head>
<body>
<div id="bg-heat"></div>
<div class="page">

  <div class="canvas-wrap">
    <canvas id="liquid-canvas"></canvas>
    <div class="thermo-wrap hidden" id="thermo-wrap">
      <div class="thermo-lbl">深</div>
      <div class="thermo-track" id="thermo-track">
        <div class="thermo-fill" id="thermo-fill"></div>
        <div class="thermo-thumb" id="thermo-thumb"></div>
      </div>
      <div class="thermo-lbl-b">浅</div>
    </div>
  </div>

  <div class="state-area">
    <div class="state-label" id="state-label">静</div>
    <div class="state-msg" id="state-msg"><span class="cursor"></span></div>
  </div>

  <div class="line"></div>

  <div class="controls">
    <label class="field-label">通行令牌</label>
    <input type="password" id="tok" class="token-input" placeholder="粘贴于此……">
    <button id="btn" class="btn btn-main">叩　门</button>
    <button id="tog" class="btn btn-outline">自　主</button>
    <div id="status">先填令牌，再叩门</div>
  </div>

</div>

<script>
// ── CANVAS SETUP ─────────────────────────────────────────
const canvas = document.getElementById('liquid-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, CX = 0, CY = 0, poolR = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  W = w; H = h;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  CX = w / 2; CY = h / 2;
  poolR = Math.min(w, h) * 0.34;
}
window.addEventListener('resize', resize);
requestAnimationFrame(resize);

// ── PARTICLES ────────────────────────────────────────────
const ripples = [], drops = [];
let rippleTimer = 0;

class Ripple {
  constructor(x, y, speed, maxR) {
    this.x = x; this.y = y; this.r = 0;
    this.maxR = maxR; this.speed = speed; this.dead = false;
  }
  tick() { this.r += this.speed; if (this.r >= this.maxR) this.dead = true; }
  draw(t) {
    const a = Math.max(0, (1 - this.r / this.maxR) * 0.7);
    const rr = Math.floor(180 + t * 60), gg = Math.floor(20 + t * 15), bb = Math.floor(38 + t * 22);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${rr},${gg},${bb},${a})`;
    ctx.lineWidth = 1.2 + t * 0.8;
    ctx.stroke();
  }
}

class Drop {
  constructor(x, y, t) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3 * t;
    this.x = x; this.y = y;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd - 2 - Math.random() * 2.5;
    this.r = 1.5 + Math.random() * 2.5; this.a = 0.9; this.dead = false;
  }
  tick() { this.vy += 0.2; this.x += this.vx; this.y += this.vy; this.a -= 0.024; if (this.a <= 0) this.dead = true; }
  draw(t) {
    const rr = Math.floor(200 + t * 55), gg = Math.floor(28 + t * 18), bb = Math.floor(48 + t * 28);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rr},${gg},${bb},${this.a})`;
    ctx.fill();
  }
}

// ── ANIMATION ────────────────────────────────────────────
let breath = 0, intensitySmooth = 0;

function frame() {
  requestAnimationFrame(frame);
  if (!W) return;

  intensitySmooth += (cur / 255 - intensitySmooth) * 0.055;
  const t = intensitySmooth;
  breath += 0.022 + t * 0.02;

  ctx.clearRect(0, 0, W, H);

  // outer glow
  if (t > 0.02) {
    const gr = poolR * (1.4 + t * 2.2);
    const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, gr);
    grd.addColorStop(0, `rgba(155,10,28,${t * 0.16})`);
    grd.addColorStop(0.55, `rgba(90,4,16,${t * 0.07})`);
    grd.addColorStop(1, `rgba(0,0,0,0)`);
    ctx.beginPath(); ctx.arc(CX, CY, gr, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();
  }

  // pool
  const breathe = 1 + 0.022 * Math.sin(breath) * (1 - t * 0.55);
  const r = poolR * breathe;
  const c1r = Math.floor(22 + t * 95), c1g = Math.floor(4 + t * 3), c1b = Math.floor(30 - t * 5);
  const c2r = Math.floor(8 + t * 48), c2g = Math.floor(2 + t * 2), c2b = Math.floor(14);
  const pg = ctx.createRadialGradient(CX - r * 0.14, CY - r * 0.18, r * 0.04, CX, CY, r);
  pg.addColorStop(0, `rgb(${c1r},${c1g},${c1b})`);
  pg.addColorStop(1, `rgb(${c2r},${c2g},${c2b})`);
  ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.fillStyle = pg; ctx.fill();

  // rim
  const rimA = 0.12 + t * 0.58;
  ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${Math.floor(185+t*70)},${Math.floor(18+t*22)},${Math.floor(36+t*28)},${rimA})`;
  ctx.lineWidth = 1.5 + t * 2.5; ctx.stroke();

  // shimmer
  for (let i = 0; i < 3; i++) {
    const ang = breath * (0.65 + i * 0.28) + i * 2.09;
    const sx = CX + Math.cos(ang) * r * (0.22 + i * 0.11);
    const sy = CY + Math.sin(ang * 1.28) * r * (0.14 + i * 0.07);
    ctx.beginPath(); ctx.arc(sx, sy, (3 + i * 2) * breathe, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,195,205,${0.038 + i * 0.018})`; ctx.fill();
  }

  // ripple emitter
  rippleTimer++;
  const freq = Math.max(3, 58 - t * 50);
  if (rippleTimer % Math.round(freq) === 0) {
    const ang = Math.random() * Math.PI * 2;
    const dist = Math.random() * r * 0.48;
    ripples.push(new Ripple(CX + Math.cos(ang)*dist, CY + Math.sin(ang)*dist, 0.75 + t*2.1, (18+t*58)+Math.random()*18));
    if (t > 0.68 && Math.random() < (t - 0.68) * 2.8) {
      const ea = Math.random() * Math.PI * 2;
      drops.push(new Drop(CX + Math.cos(ea)*r*(0.7+Math.random()*0.35), CY + Math.sin(ea)*r*(0.7+Math.random()*0.35), t));
    }
  }

  for (let i = ripples.length-1; i >= 0; i--) { ripples[i].tick(); ripples[i].draw(t); if (ripples[i].dead) ripples.splice(i,1); }
  for (let i = drops.length-1;  i >= 0; i--) { drops[i].tick();  drops[i].draw(t);  if (drops[i].dead)  drops.splice(i,1); }

  // overflow corona
  if (t > 0.82) {
    const ov = (t - 0.82) / 0.18;
    ctx.beginPath(); ctx.arc(CX, CY, r * (1 + ov * 0.09), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(225,45,65,${ov * 0.45})`; ctx.lineWidth = 3 + ov * 5; ctx.stroke();
  }
}
frame();

// bg heat glow
function setBgHeat(t) {
  const a = t * 0.28;
  document.getElementById('bg-heat').style.background =
    `radial-gradient(ellipse 72% 55% at 50% 38%, rgba(138,8,26,${a}) 0%, rgba(78,3,14,${a*.38}) 50%, rgba(0,0,0,0) 100%)`;
}

// ── STATES ───────────────────────────────────────────────
const STATES = [
  { at:   0, label: '静',   msgs: ['...', '风平浪静'] },
  { at:  20, label: '初动', msgs: ['有所感', '轻轻地', '窸窣'] },
  { at:  70, label: '渐燃', msgs: ['止不住了', '继续吗', '蔓延开了'] },
  { at: 115, label: '难禁', msgs: ['陷进去了', '身不由己', '深一点'] },
  { at: 155, label: '失控', msgs: ['别停', '越陷越深', '挡不住了'] },
  { at: 205, label: '溢',   msgs: ['溢出来了', '全然沉沦', '挡不住了'] },
];

function getState(v) {
  let s = STATES[0];
  for (const st of STATES) { if (v >= st.at) s = st; }
  return s;
}

let typeT = null, lastMsg = '', cycleT = null, lastSt = null;

function typeWrite(text) {
  if (text === lastMsg) return; lastMsg = text;
  clearTimeout(typeT);
  const el = document.getElementById('state-msg');
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  (function step() {
    if (i < text.length) { el.innerHTML = text.slice(0,++i) + '<span class="cursor"></span>'; typeT = setTimeout(step, 68 + Math.random()*48); }
  })();
}

function cycleMsgs(st) {
  clearTimeout(cycleT);
  if (st.msgs.length < 2) return;
  let mi = 1;
  (function next() {
    if (getState(cur) !== st) return;
    typeWrite(st.msgs[mi++ % st.msgs.length]);
    cycleT = setTimeout(next, 4400 + Math.random()*2000);
  })();
}

function updateDisplay(v) {
  setBgHeat(v / 255);
  updateThermo(v);
  const lbl = document.getElementById('state-label');
  const t = v / 255;
  lbl.style.textShadow = `0 0 ${t*32}px rgba(220,48,68,${t*.82})`;
  const s = getState(v);
  lbl.textContent = s.label;
  if (s !== lastSt) { lastSt = s; typeWrite(s.msgs[0]); if (v > 0) cycleMsgs(s); }
}

// ── THERMO ────────────────────────────────────────────────
const thermoTrack = document.getElementById('thermo-track');
let dragging = false;

function updateThermo(v) {
  const pct = v / 255 * 100;
  document.getElementById('thermo-fill').style.height = pct + '%';
  document.getElementById('thermo-thumb').style.bottom = pct + '%';
}

function valFromY(clientY) {
  const rect = thermoTrack.getBoundingClientRect();
  return Math.round((1 - Math.max(0, Math.min(1, (clientY-rect.top)/rect.height))) * 255);
}
function thermoInput(clientY) { if (!manual) return; const v = valFromY(clientY); setSpd(v); send(v); }
thermoTrack.addEventListener('mousedown',  e => { dragging=true; thermoInput(e.clientY); });
document.addEventListener('mousemove',     e => { if (dragging) thermoInput(e.clientY); });
document.addEventListener('mouseup',       () => { dragging=false; });
thermoTrack.addEventListener('touchstart', e => { dragging=true; thermoInput(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
thermoTrack.addEventListener('touchmove',  e => { if (dragging) thermoInput(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
thermoTrack.addEventListener('touchend',   () => { dragging=false; });

// ── CONTROL LOGIC ─────────────────────────────────────────
let ch, keepT, pollT, manual=false, cur=0, last=-1;
const L = t => document.getElementById('status').textContent = t;
const getK = () => document.getElementById('tok').value.trim();

function setSpd(v) { cur = v; updateDisplay(v); }

async function send(v) {
  if (!ch) return;
  try { const c = v>0?[0x55,0x04,0,0,1,v,0xAA]:[0x55,0x04,0,0,0,0,0xAA]; await ch.writeValueWithoutResponse(new Uint8Array(c)); } catch(_) {}
}

async function poll() {
  if (manual) return;
  const k = getK(); if (!k) return;
  try {
    const r = await fetch('https://api.github.com/repos/Jenniferrr7/edeny-ble/contents/cmd.json',
      { headers: { 'Authorization':'token '+k, 'Accept':'application/vnd.github.v3.raw' }, cache:'no-store' });
    if (!r.ok) { L('错误 '+r.status); return; }
    const d = await r.json();
    let v = 0;
    if (typeof d.level === 'number') { v = d.level; }
    else if (typeof d.content === 'string') { try { const raw = JSON.parse(atob(d.content.replace(/\s/g,''))); if (typeof raw.level==='number') v=raw.level; } catch(_) {} }
    if (v !== last) { last=v; setSpd(v); send(v); L(v>0?'♡ 远程  '+v:'♡ 归于宁静'); }
  } catch(e) { L('err: '+e.message); }
}

document.getElementById('tog').onclick = () => {
  manual = !manual;
  const b = document.getElementById('tog');
  const tw = document.getElementById('thermo-wrap');
  b.classList.toggle('active', manual);
  b.textContent = manual ? '切回远程' : '自　主';
  tw.classList.toggle('hidden', !manual);
  if (!manual) { setSpd(0); last=-1; send(0); }
  L(manual ? '自主模式' : '远程模式');
};

document.getElementById('btn').onclick = async () => {
  if (!getK()) { L('先填令牌……'); return; }
  try {
    const d = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:['0000ffe0-0000-1000-8000-00805f9b34fb'] });
    const s  = await d.gatt.connect();
    const sv = await s.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
    ch = await sv.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
    setSpd(0); last=0; send(0);
    L('♡ 已入，等待……');
    const b = document.getElementById('btn');
    b.textContent = '已　入'; b.classList.add('dim');
    clearInterval(keepT);
    keepT = setInterval(() => send(cur), 1400);
    setTimeout(() => { last=-1; poll(); pollT=setInterval(poll,1500); }, 3000);
  } catch(e) { L('错误: '+e.message); }
};

updateDisplay(0);
</script>
</body>
</html>
