<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>叩门</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --parchment:  #EDE4C8;
  --parchment2: #DDD0A8;
  --ink:        #1C0E09;
  --ink-mid:    #4A2C1A;
  --crimson:    #781212;
  --crimson-lo: #4A0808;
  --crimson-hi: #C85050;
  --gold:       #9B7820;
  --gold-lo:    #6B5010;
  --blush:      #C87070;
}

body {
  background: var(--parchment);
  color: var(--ink);
  font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 18px 48px;
  position: relative;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* Aged-paper grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.012) 3px, rgba(0,0,0,.012) 4px),
    repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(0,0,0,.007) 5px, rgba(0,0,0,.007) 6px);
  pointer-events: none;
  z-index: 500;
}

/* Subtle vignette */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(28,14,9,.18) 100%);
  pointer-events: none;
  z-index: 499;
}

/* ── PAGE WRAPPER ── */
.page {
  width: 100%;
  max-width: 370px;
  position: relative;
  z-index: 10;
}

/* ── ORNATE FRAME ── */
.frame {
  border: 1.5px solid var(--ink-mid);
  padding: 18px 16px 20px;
  position: relative;
  margin-bottom: 0;
}
.frame::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 0.5px solid var(--gold);
  pointer-events: none;
}
.corner {
  position: absolute;
  font-size: 11px;
  color: var(--gold);
  line-height: 1;
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--parchment);
}
.tl { top: -1px; left: -1px; }
.tr { top: -1px; right: -1px; }
.bl { bottom: -1px; left: -1px; }
.br { bottom: -1px; right: -1px; }

/* ── HEADER ── */
.header {
  text-align: center;
  margin-bottom: 14px;
}
.header-orn {
  font-size: 10px;
  letter-spacing: 0.55em;
  color: var(--gold);
  margin-bottom: 7px;
}
.title {
  font-size: 26px;
  font-weight: normal;
  letter-spacing: 0.6em;
  color: var(--crimson);
  font-style: italic;
  line-height: 1;
  margin-bottom: 4px;
  text-indent: 0.6em;
}
.subtitle {
  font-size: 9px;
  letter-spacing: 0.4em;
  color: var(--ink-mid);
  text-transform: uppercase;
  font-style: normal;
}

/* ── RULE WITH ORNAMENT ── */
.ornrule {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}
.ornrule::before,
.ornrule::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: var(--parchment2);
}
.ornrule span {
  font-size: 9px;
  color: var(--gold);
  letter-spacing: 0.1em;
}

/* ── MAIN STAGE (flower + thermometer) ── */
.stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin: 4px 0 8px;
}

#flower-canvas {
  display: block;
  flex-shrink: 0;
}

/* ── THERMOMETER ── */
.thermo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  touch-action: none;
}
.thermo-top-label {
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--ink-mid);
  text-transform: uppercase;
  margin-bottom: 5px;
  font-style: italic;
}
.thermo-track {
  width: 14px;
  height: 154px;
  border: 1.5px solid var(--ink-mid);
  border-radius: 7px 7px 0 0;
  background: var(--parchment2);
  position: relative;
  cursor: ns-resize;
  overflow: hidden;
  touch-action: none;
}
/* tick marks */
.thermo-track::after {
  content: '';
  position: absolute;
  right: -8px;
  top: 0; bottom: 0;
  width: 6px;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0px, transparent 28px,
      var(--ink-mid) 28px, var(--ink-mid) 29px,
      transparent 29px, transparent 30px);
  pointer-events: none;
}
.thermo-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 0%;
  background: linear-gradient(to top, var(--crimson-lo), var(--crimson), var(--blush));
  transition: height 0.4s ease;
}
.thermo-fill::after {
  content: '';
  position: absolute;
  top: 0; left: 2px; right: 2px;
  height: 3px;
  background: rgba(255,255,255,.35);
}
.thermo-bulb {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, var(--blush), var(--crimson) 60%, var(--crimson-lo));
  border: 1.5px solid var(--ink-mid);
  margin-top: -1px;
  flex-shrink: 0;
  transition: background 0.4s;
}
.thermo-bottom-label {
  font-size: 8px;
  letter-spacing: 0.2em;
  color: var(--ink-mid);
  text-transform: uppercase;
  margin-top: 4px;
  font-style: italic;
}

/* ── STATE TEXT ── */
.state-text {
  text-align: center;
  font-size: 26px;
  font-weight: normal;
  font-style: italic;
  letter-spacing: 0.3em;
  color: var(--crimson);
  min-height: 38px;
  transition: color 0.9s, opacity 0.5s;
  line-height: 1.3;
}
.quill-msg {
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.18em;
  color: var(--ink-mid);
  min-height: 22px;
  font-style: italic;
  margin-top: 4px;
  opacity: 0.9;
}
.cursor {
  display: inline-block;
  width: 1px; height: 11px;
  background: var(--ink-mid);
  vertical-align: middle;
  margin-left: 1px;
  animation: blink 1.1s infinite;
}
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ── CONTROLS ── */
.controls { margin-top: 6px; }

.field-label {
  display: block;
  font-size: 9px;
  letter-spacing: 0.38em;
  color: var(--gold-lo);
  text-transform: uppercase;
  margin-bottom: 5px;
}

.token-input {
  width: 100%;
  padding: 10px 12px;
  background: rgba(180,160,110,.12);
  border: 1px solid var(--parchment2);
  border-bottom-color: var(--ink-mid);
  border-right-color: var(--ink-mid);
  color: var(--ink);
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  outline: none;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}
.token-input:focus { border-color: var(--crimson); }
.token-input::placeholder { color: var(--ink-mid); opacity: 0.5; }

.engraved-btn {
  width: 100%;
  padding: 13px;
  font-family: 'Palatino Linotype', Palatino, Georgia, serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.35em;
  cursor: pointer;
  background: var(--crimson);
  color: #F5E8D8;
  border: none;
  border-bottom: 3px solid var(--crimson-lo);
  border-right: 2px solid var(--crimson-lo);
  transition: transform 0.08s, border-width 0.08s;
  margin-bottom: 8px;
  text-indent: 0.35em;
}
.engraved-btn:active {
  transform: translate(1px, 2px);
  border-bottom-width: 1px;
  border-right-width: 1px;
}
.engraved-btn.outline {
  background: transparent;
  color: var(--crimson);
  border: 1px solid var(--crimson);
}
.engraved-btn.outline:active {
  transform: translate(1px, 1px);
}
.engraved-btn.dim {
  background: #3A0A0A;
  cursor: default;
  letter-spacing: 0.45em;
}
.engraved-btn.manual-on {
  background: var(--ink-mid);
}

#status {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-mid);
  font-style: italic;
  min-height: 18px;
  margin-top: 2px;
}

/* ── THERMO DISABLED STATE ── */
.thermo-wrap.remote .thermo-track { cursor: default; opacity: 0.75; }
</style>
</head>
<body>
<div class="page">
  <div class="frame">
    <span class="corner tl">✦</span>
    <span class="corner tr">✦</span>
    <span class="corner bl">✦</span>
    <span class="corner br">✦</span>

    <!-- Header -->
    <div class="header">
      <div class="header-orn">❧ &nbsp; &nbsp; ❧</div>
      <h1 class="title">叩　门</h1>
      <div class="subtitle">Edeny · Remote</div>
    </div>

    <div class="ornrule"><span>✦</span></div>

    <!-- Flower + Thermometer -->
    <div class="stage">
      <canvas id="flower-canvas" width="170" height="170"></canvas>
      <div class="thermo-wrap remote" id="thermo-wrap">
        <div class="thermo-top-label">深</div>
        <div class="thermo-track" id="thermo-track">
          <div class="thermo-fill" id="thermo-fill"></div>
        </div>
        <div class="thermo-bulb" id="thermo-bulb"></div>
        <div class="thermo-bottom-label">浅</div>
      </div>
    </div>

    <div class="ornrule"><span>✦</span></div>

    <!-- State + Message -->
    <div class="state-text" id="state-text">宁&nbsp;静</div>
    <div class="quill-msg" id="quill-msg"><span class="cursor"></span></div>

    <div class="ornrule"><span>✦</span></div>

    <!-- Controls -->
    <div class="controls">
      <label class="field-label">通行令牌</label>
      <input type="password" id="tok" class="token-input" placeholder="粘贴于此……">
      <button id="btn" class="engraved-btn">叩　门</button>
      <button id="tog" class="engraved-btn outline">自　主</button>
      <div id="status">先填令牌，再叩门</div>
    </div>
  </div>
</div>

<script>
// ── FLOWER ──────────────────────────────────────────────
const fc = document.getElementById('flower-canvas');
const fx = fc.getContext('2d');
const CX = fc.width / 2, CY = fc.height / 2;
let flowerAnim = 0, flowerTarget = 0;
const PETALS = 6;

function lerp(a, b, t) { return a + (b - a) * t; }

function drawFlower(p) {
  fx.clearRect(0, 0, fc.width, fc.height);
  // p: 0 = closed bud, 1 = fully open

  const maxLen = 68, maxWid = 24;

  // Outer petals
  for (let i = 0; i < PETALS; i++) {
    const angle = (i / PETALS) * Math.PI * 2 + Math.PI / PETALS * 0.5;
    const len = maxLen * p;
    const wid = maxWid * p;
    if (len < 1) continue;
    fx.save();
    fx.translate(CX, CY);
    fx.rotate(angle);
    fx.beginPath();
    fx.moveTo(0, 0);
    fx.bezierCurveTo( wid * 0.85, -len * 0.33,  wid * 0.9,  -len * 0.72, 0, -len);
    fx.bezierCurveTo(-wid * 0.9,  -len * 0.72, -wid * 0.85, -len * 0.33, 0,  0);
    fx.closePath();
    const g = fx.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0,   '#6B1010');
    g.addColorStop(0.45,'#9B2828');
    g.addColorStop(1,   '#D07070');
    fx.fillStyle = g;
    fx.globalAlpha = 0.82 + 0.18 * p;
    fx.fill();
    // vein
    fx.beginPath();
    fx.moveTo(0, -2);
    fx.quadraticCurveTo(wid * 0.1, -len * 0.5, 0, -len * 0.9);
    fx.strokeStyle = 'rgba(80,10,10,0.25)';
    fx.lineWidth = 0.8;
    fx.stroke();
    fx.restore();
  }

  // Inner petals (appear when halfway open)
  if (p > 0.38) {
    const ip = Math.min(1, (p - 0.38) / 0.55);
    for (let i = 0; i < PETALS; i++) {
      const angle = (i / PETALS) * Math.PI * 2;
      const len = maxLen * 0.56 * ip;
      const wid = maxWid * 0.5 * ip;
      if (len < 1) continue;
      fx.save();
      fx.translate(CX, CY);
      fx.rotate(angle);
      fx.beginPath();
      fx.moveTo(0, 0);
      fx.bezierCurveTo( wid, -len * 0.35,  wid, -len * 0.72, 0, -len);
      fx.bezierCurveTo(-wid, -len * 0.72, -wid, -len * 0.35, 0,  0);
      fx.closePath();
      fx.fillStyle = 'rgba(160,45,45,' + (0.65 * ip) + ')';
      fx.globalAlpha = ip * 0.9;
      fx.fill();
      fx.restore();
    }
  }

  // Bud (closed / early)
  if (p < 0.4) {
    const bp = 1 - p / 0.4;
    const bH = 30 * bp + 6, bW = 11 * bp + 3;
    fx.save();
    fx.translate(CX, CY);
    // sepal leaves
    for (let s = 0; s < 3; s++) {
      const sa = (s / 3) * Math.PI * 2;
      fx.save();
      fx.rotate(sa);
      fx.beginPath();
      fx.moveTo(0, 0);
      fx.bezierCurveTo(5 * bp, -8 * bp, 3 * bp, -14 * bp, 0, -16 * bp);
      fx.bezierCurveTo(-3 * bp, -14 * bp, -5 * bp, -8 * bp, 0, 0);
      fx.fillStyle = 'rgba(38,58,18,' + (0.6 * bp) + ')';
      fx.globalAlpha = bp;
      fx.fill();
      fx.restore();
    }
    // bud body
    fx.beginPath();
    fx.ellipse(0, -bH * 0.48, bW * 0.5, bH * 0.52, 0, 0, Math.PI * 2);
    const bg = fx.createRadialGradient(-bW*0.15, -bH*0.35, 1, 0, -bH*0.48, bW*0.55);
    bg.addColorStop(0, '#B04040');
    bg.addColorStop(1, '#4A0A0A');
    fx.fillStyle = bg;
    fx.globalAlpha = bp * 0.95;
    fx.fill();
    fx.restore();
  }

  // Stamen / center (appears as it opens)
  if (p > 0.28) {
    const sp = Math.min(1, (p - 0.28) / 0.5);
    const r = 13 * sp;
    fx.save();
    fx.translate(CX, CY);
    // disc
    const cg = fx.createRadialGradient(0, 0, 0, 0, 0, r);
    cg.addColorStop(0,   '#E8B830');
    cg.addColorStop(0.6, '#C4900A');
    cg.addColorStop(1,   '#8B6010');
    fx.beginPath();
    fx.arc(0, 0, r, 0, Math.PI * 2);
    fx.fillStyle = cg;
    fx.globalAlpha = sp;
    fx.fill();
    // stamen dots
    if (sp > 0.45) {
      const dp = (sp - 0.45) / 0.55;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const dr = r * 0.72;
        fx.beginPath();
        fx.arc(Math.cos(a) * dr, Math.sin(a) * dr, 1.8, 0, Math.PI * 2);
        fx.fillStyle = '#F5D050';
        fx.globalAlpha = dp * 0.95;
        fx.fill();
        // filament
        fx.beginPath();
        fx.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3);
        fx.lineTo(Math.cos(a) * dr, Math.sin(a) * dr);
        fx.strokeStyle = 'rgba(200,160,20,0.4)';
        fx.lineWidth = 0.7;
        fx.globalAlpha = dp * 0.7;
        fx.stroke();
      }
    }
    fx.restore();
  }

  fx.globalAlpha = 1;
}

// breathing animation
let breath = 0;
function tick() {
  requestAnimationFrame(tick);
  breath += 0.028;
  // smooth lerp toward target
  flowerAnim += (flowerTarget - flowerAnim) * 0.055;
  // tiny breathing oscillation (more at mid speeds)
  const breathAmt = 0.012 * Math.sin(breath) * (1 - Math.abs(flowerTarget - 0.5) * 1.4);
  drawFlower(Math.max(0, Math.min(1, flowerAnim + breathAmt)));
}
tick();

// ── STATES ──────────────────────────────────────────────
const STATES = [
  { at: 0,   label: '宁　静', msgs: ['...', '归于静默', '风平浪静'] },
  { at: 20,  label: '微　颤', msgs: ['她有所感', '微如羽触', '窸窸窣窣', '轻轻地'] },
  { at: 70,  label: '惊　醒', msgs: ['感受在蔓延', '已无退路', '继续吗'] },
  { at: 115, label: '迷　失', msgs: ['身不由己', '沉入其中', '深陷其中'] },
  { at: 155, label: '沉　沦', msgs: ['无法停止', '越陷越深', '已无退路'] },
  { at: 205, label: '无法自持', msgs: ['已至深处', '全然沉沦', '忘乎所以'] },
];

function getState(v) {
  let s = STATES[0];
  for (const st of STATES) { if (v >= st.at) s = st; }
  return s;
}

// ── TYPEWRITER ──────────────────────────────────────────
let typeT = null, lastMsg = '', msgIdx = 0, cycleT = null;

function typeWrite(text) {
  if (text === lastMsg) return;
  lastMsg = text;
  clearTimeout(typeT);
  const el = document.getElementById('quill-msg');
  el.innerHTML = '<span class="cursor"></span>';
  let i = 0;
  function step() {
    if (i < text.length) {
      el.innerHTML = text.slice(0, ++i) + '<span class="cursor"></span>';
      typeT = setTimeout(step, 75 + Math.random() * 55);
    }
  }
  step();
}

let lastSt = null;
function cycleMsgs(st) {
  clearTimeout(cycleT);
  if (st.msgs.length < 2) return;
  let mi = 1;
  function next() {
    if (getState(cur) !== st) return;
    typeWrite(st.msgs[mi % st.msgs.length]);
    mi++;
    cycleT = setTimeout(next, 4800 + Math.random() * 2000);
  }
  cycleT = setTimeout(next, 4200);
}

function updateDisplay(v) {
  const s = getState(v);
  document.getElementById('state-text').textContent = s.label;
  flowerTarget = v === 0 ? 0 : 0.04 + (v / 255) * 0.96;

  const pct = v / 255 * 100;
  document.getElementById('thermo-fill').style.height = pct + '%';
  // bulb color shift
  const bl = document.getElementById('thermo-bulb');
  bl.style.background = v === 0
    ? 'radial-gradient(circle at 38% 35%, var(--blush), var(--crimson) 60%, var(--crimson-lo))'
    : 'radial-gradient(circle at 38% 35%, #FF9090, #C82020 55%, #4A0000)';

  if (s !== lastSt) {
    lastSt = s;
    typeWrite(s.msgs[0]);
    if (v > 0) cycleMsgs(s);
  }
}

// ── THERMOMETER DRAG ────────────────────────────────────
const thermoTrack = document.getElementById('thermo-track');
let dragging = false;

function valFromY(clientY) {
  const rect = thermoTrack.getBoundingClientRect();
  const ratio = 1 - Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
  return Math.round(ratio * 255);
}
function thermoInput(clientY) {
  if (!manual) return;
  const v = valFromY(clientY);
  setSpd(v);
  send(v);
}
thermoTrack.addEventListener('mousedown',  e => { dragging = true; thermoInput(e.clientY); });
document.addEventListener('mousemove',     e => { if (dragging) thermoInput(e.clientY); });
document.addEventListener('mouseup',       () => { dragging = false; });
thermoTrack.addEventListener('touchstart', e => { dragging = true; thermoInput(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
thermoTrack.addEventListener('touchmove',  e => { if (dragging) thermoInput(e.touches[0].clientY); e.preventDefault(); }, { passive: false });
thermoTrack.addEventListener('touchend',   () => { dragging = false; });

// ── CONTROL LOGIC ───────────────────────────────────────
let ch, keepT, pollT, manual = false, cur = 0, last = -1;
const L = t => document.getElementById('status').textContent = t;
const getK = () => document.getElementById('tok').value.trim();

function setSpd(v) {
  cur = v;
  updateDisplay(v);
}

async function send(v) {
  if (!ch) return;
  try {
    const c = v > 0 ? [0x55,0x04,0,0,1,v,0xAA] : [0x55,0x04,0,0,0,0,0xAA];
    await ch.writeValueWithoutResponse(new Uint8Array(c));
  } catch(_) {}
}

async function poll() {
  if (manual) return;
  const k = getK(); if (!k) return;
  try {
    const r = await fetch(
      'https://api.github.com/repos/Jenniferrr7/edeny-ble/contents/cmd.json',
      { headers: { 'Authorization': 'token ' + k, 'Accept': 'application/vnd.github.v3.raw' }, cache: 'no-store' }
    );
    if (!r.ok) { L('错误 ' + r.status); return; }
    const d = await r.json();
    let v = 0;
    if (typeof d.level === 'number') {
      v = d.level;
    } else if (typeof d.content === 'string') {
      try {
        const raw = JSON.parse(atob(d.content.replace(/\s/g, '')));
        if (typeof raw.level === 'number') v = raw.level;
      } catch(_) {}
    }
    if (v !== last) { last = v; setSpd(v); send(v); L(v > 0 ? '♡ 远程  ' + v : '♡ 归于宁静'); }
  } catch(e) { L('err: ' + e.message); }
}

document.getElementById('tog').onclick = () => {
  manual = !manual;
  const b = document.getElementById('tog');
  const w = document.getElementById('thermo-wrap');
  b.classList.toggle('manual-on', manual);
  b.textContent = manual ? '切回远程' : '自　主';
  w.classList.toggle('remote', !manual);
  if (!manual) { setSpd(0); last = -1; send(0); }
  L(manual ? '自主模式——拖动体温计' : '远程模式');
};

document.getElementById('btn').onclick = async () => {
  if (!getK()) { L('先填令牌……'); return; }
  try {
    const d = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
    });
    const s  = await d.gatt.connect();
    const sv = await s.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
    ch = await sv.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
    setSpd(0); last = 0; send(0);
    L('♡ 已入，等待……');
    const b = document.getElementById('btn');
    b.textContent = '已　入';
    b.classList.add('dim');
    clearInterval(keepT);
    keepT = setInterval(() => send(cur), 1400);
    setTimeout(() => { last = -1; poll(); pollT = setInterval(poll, 1500); }, 3000);
  } catch(e) { L('错误: ' + e.message); }
};

updateDisplay(0);
</script>
